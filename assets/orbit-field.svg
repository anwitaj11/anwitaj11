<g fill="#aeb7bd" font-family="monospace" font-size="14" letter-spacing="2">
<text x="48" y="52">ORBITAL STUDY / 001</text>
<text x="48" y="290">OBSERVATION IS A FORM OF EXPLORATION.</text>
<text x="995" y="290">35.0° N / ∞</text>
</g>
<g stroke="#89949c" stroke-width="1"><path d="M40 75H110M40 75V95M1160 245H1090M1160 245V225"/></g>
</svg>