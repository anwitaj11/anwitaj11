<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Computing beyond the obvious</title><desc id="desc">Animated monochrome orbital observatory with editorial typography and a subtle grid.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#273039" stroke-width=".7"/></pattern><linearGradient id="fade" x1="0" x2="1"><stop stop-color="#111820"/><stop offset="1" stop-color="#080c10"/></linearGradient><clipPath id="crop"><rect width="1200" height="430"/></clipPath></defs>
<rect width="1200" height="430" fill="url(#fade)"/><rect width="1200" height="430" fill="url(#grid)" opacity=".5"/>
<g clip-path="url(#crop)">
<g transform="translate(905 209)" fill="none">
<circle r="164" stroke="#343f49"/><circle r="124" stroke="#303b45" stroke-dasharray="2 8"/><circle r="82" stroke="#384550"/><circle r="39" stroke="#57636b"/>
<ellipse rx="295" ry="104" transform="rotate(-29)" stroke="#b7c3ca" stroke-width="1.4" opacity=".75"/>
<ellipse rx="242" ry="80" transform="rotate(44)" stroke="#5b6872" stroke-width="1"/>
