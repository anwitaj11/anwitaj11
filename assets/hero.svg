<circle r="7" fill="#d7e1e5"/><circle r="15" stroke="#d7e1e5" opacity=".45"/>
<g transform="rotate(-29)"><circle cx="295" cy="0" r="6" fill="#e5f2f6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="16s" repeatCount="indefinite" additive="sum"/></circle></g>
<g><circle cx="124" cy="0" r="3" fill="#9daab4"><animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="25s" repeatCount="indefinite"/></circle></g>
</g>
